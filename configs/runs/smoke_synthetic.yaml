# SYNTHETIC STAND-IN, for testing the pipeline only.
# The `synthetic` profile replaces the 5G testbed with a statistical simulator
# (testbed/sim/synthetic_testbed.py). It exercises the scheduler, labels, exporter schema,
# feature builder, detectors, evaluator and figures end to end without Kubernetes.
# Its numbers say nothing about Open5GS and must never appear in the report or on a CV.
# Results land in results/smoke/, which is git-ignored on purpose.
run:
  name: smoke_synthetic
  profile: synthetic
  source: synthetic
  duration: 16h
  warmup: 0m
  seed: 7
  namespace: 5g
  ue_entity: ue1

traffic:
  mix: {iperf_burst: 0.3, ping_only: 0.4, idle: 0.2, reattach: 0.1}
  iperf_burst: {duration: [20s, 120s], mbps: [2, 20], parallel: [1, 2]}
  ping_only:   {duration: [30s, 180s]}
  idle:        {duration: [30s, 240s]}
  reattach:    {down: [5s, 20s]}

faults:
  min_gap: 15m
  first_after: 10m
  grace: 60s
  catalog:
    - {type: delay, injector: mininet, targets: ["link:s1-s2", "link:s2-s3"], mild: {delay_ms: 10, jitter_ms: 2}, strong: {delay_ms: 50, jitter_ms: 10}, duration: [2m, 10m]}
    - {type: loss, injector: mininet, targets: ["link:s1-s2", "link:s2-s3"], mild: {loss_pct: 1}, strong: {loss_pct: 5}, duration: [2m, 10m]}
    - {type: link_down, injector: mininet, targets: ["link:s1-s2"], mild: {}, strong: {}, duration: [1m, 3m]}
    - {type: cpu, injector: chaos-mesh, targets: ["pod:upf"], mild: {workers: 1, load: 50}, strong: {workers: 2, load: 100}, duration: [3m, 5m]}
    - {type: mem, injector: chaos-mesh, targets: ["pod:upf"], mild: {size: 256MB}, strong: {size: 768MB}, duration: [3m, 5m]}
    - {type: pod_kill, injector: chaos-mesh, targets: ["pod:amf"], mild: {}, strong: {}, duration: [1m, 3m]}
    - {type: flood, injector: traffic, targets: ["pod:ue"], mild: {parallel: 4, mbps: 30}, strong: {parallel: 8, mbps: 80}, duration: [2m, 5m]}

monitoring:
  scrape_interval: 5s
  metric_map: configs/metric_map.yaml
