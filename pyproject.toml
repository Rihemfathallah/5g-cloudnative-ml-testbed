[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed"
version = "0.1.0"
description = "Cloud-native 5G testbed (Open5GS, srsRAN, Kubernetes, SDN transport) for anomaly detection and handover prediction"
authors = [{ name = "Rihem Fathallah" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "requests>=2.31",
  "prometheus_client>=0.19",
]

[project.optional-dependencies]
bgp = ["mrtparse>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
tb = "testbed.cli:main"

[tool.setuptools.packages.find]
include = ["testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains models, a few seconds or more"]
