          \ -o ogstun -j MASQUERADE\nsed \"s/__POD_IP__/$POD_IP/g\" /etc/open5gs-tmpl/upf.yaml\
          \ > /tmp/upf.yaml && mkdir -p /var/log/open5gs && exec open5gs-upfd -c /tmp/upf.yaml"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: sbi
          containerPort: 7777
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: pfcp
          containerPort: 8805
          protocol: UDP
        - name: gtpu
          containerPort: 2152
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /etc/open5gs-tmpl
        - name: tun
          mountPath: /dev/net/tun
        readinessProbe:
          tcpSocket:
            port: 7777
          periodSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
        securityContext:
          privileged: true
      - name: dn
        image: testbed/probe:1.0
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - iperf3 -s -p 5201 -D && exec iperf3 -s -p 5202
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: open5gs-config
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: 5g
  labels:
    app: upf
spec:
  selector:
    app: upf
  ports:
  - name: sbi
    port: 7777
    targetPort: 7777
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: pfcp
    port: 8805
    targetPort: 8805
    protocol: UDP
  - name: gtpu
    port: 2152
    targetPort: 2152
    protocol: UDP
